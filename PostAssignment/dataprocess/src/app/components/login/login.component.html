<form
  class="form alert alert-info p-4 rounded shadow"
  [formGroup]="loginForm!"
  (ngSubmit)="login(loginForm?.value)"
  style="max-width: 500px; margin: auto; border: 1px solid #17a2b8;">
  <div class="form-group">
    <label for="username" class="font-weight-bold text-primary">UserName</label>
    <input
      type="text"
      class="form-control border border-primary"
      id="username"
      formControlName="username"
      placeholder="Enter your username">
  </div>
  <div class="form-group">
    <label for="password" class="font-weight-bold text-primary">Password</label>
    <input
      type="password"
      class="form-control border border-primary"
      id="password"
      formControlName="password"
      placeholder="Enter your password">
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
  
  <input
    class="btn btn-primary btn-lg btn-block mt-3"
    type="submit"
    value="Submit">

</form>
